publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  cupertino_ui: ^1.1.6
  decimal: ^3.2.6
  dio: ^5.11.1
  equatable: ^3.0.0
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  intl: ^0.20.3
  material_ui: ^1.11.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
