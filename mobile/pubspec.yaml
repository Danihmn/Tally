name: mobile
description: "Tally: personal finance assistant for a household (mobile client of the Tally API)."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.14.0

dependencies:
  cupertino_ui: ^1.1.6
  decimal: ^3.2.6
  dio: ^5.11.1
  equatable: ^3.0.0
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  intl: ^0.20.3
  material_ui: ^1.11.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

# App icon (Android only). Sources in assets/icon/ (tally-icon.svg is the original).
# Regenerate after changing them: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # The foreground already has the safe-zone margin, so no extra padding.
  adaptive_icon_foreground_inset: 0

# Splash screen (Android only). Regenerate: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#2F4F97"
  image: assets/icon/splash.png
  android_12:
    color: "#2F4F97"
    image: assets/icon/splash.png
  ios: false
  web: false
