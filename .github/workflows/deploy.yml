name: Deploy

on:
    push:
        branches: [main]

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest
                      type=sha

            - uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Copy deploy files to server
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  source: "backend/compose.yaml,backend/Caddyfile"
                  target: "/home/ubuntu/app"
                  strip_components: 1

            - name: Deploy on server
              uses: appleboy/ssh-action@v1.2.0
              env:
                  GHCR_USER: ${{ github.actor }}
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  envs: GHCR_USER,GHCR_TOKEN
                  script_stop: true
                  script: |
                      cd /home/ubuntu/app
                      echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
                      docker compose pull api
                      docker compose run --rm api alembic upgrade head
                      docker compose up -d
                      docker image prune -f

    distribute-app:
        needs: build-and-deploy
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true

            - name: Install dependencies
              working-directory: ./mobile
              run: flutter pub get

            - name: Build release APK
              working-directory: ./mobile
              run: |
                  flutter build apk --release \
                      --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} \
                      --dart-define=ENVIRONMENT=prod

            - name: Distribute via Firebase App Distribution
              env:
                  FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
                  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
                  COMMIT_SHA: ${{ github.sha }}
              run: |
                  echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-credentials.json"
                  export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-credentials.json"
                  npm install -g firebase-tools
                  firebase appdistribution:distribute \
                      mobile/build/app/outputs/flutter-apk/app-release.apk \
                      --app "$FIREBASE_APP_ID" \
                      --groups "tally_users" \
                      --release-notes "Automatic deploy - commit $COMMIT_SHA"
                  rm -f "$RUNNER_TEMP/firebase-credentials.json"
